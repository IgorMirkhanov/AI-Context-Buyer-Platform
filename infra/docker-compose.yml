# Запуск из корня репозитория:
# docker compose --env-file .env -f infra/docker-compose.yml up --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-context}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-context}
      POSTGRES_DB: ${POSTGRES_DB:-context_buyer}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-context} -d ${POSTGRES_DB:-context_buyer}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-context}:${POSTGRES_PASSWORD:-context}@postgres:5432/${POSTGRES_DB:-context_buyer}?schema=public
      REDIS_URL: redis://redis:6379
      PIPELINE_QUEUE: auto
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      YANDEX_REDIRECT_URI: ${YANDEX_REDIRECT_URI:-http://localhost:3001/oauth/yandex/callback}
    ports:
      - "${API_PORT:-3001}:3001"

volumes:
  postgres_data:
